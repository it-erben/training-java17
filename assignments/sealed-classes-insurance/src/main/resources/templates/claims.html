<!DOCTYPE html>
<html lang="de" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Versicherungsschäden</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>
<main>
    <h1>Sealed Classes in der Schadenprüfung</h1>
    <p>Die zugelassenen Schadenstypen sind durch das sealed Interface fest definiert.</p>

    <table>
        <thead>
        <tr>
            <th>Police</th>
            <th>Kategorie</th>
            <th>Betrag</th>
            <th>Analyse</th>
            <th>Nächster Schritt</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="claim : ${claims}">
            <td th:text="${claim.policyNumber()}">Nummer</td>
            <td>
                <span th:if="${claim instanceof T(tech.erben.java17.sealedclasses.model.CarClaim)}">Kfz</span>
                <span th:if="${claim instanceof T(tech.erben.java17.sealedclasses.model.HealthClaim)}">Gesundheit</span>
                <span th:if="${claim instanceof T(tech.erben.java17.sealedclasses.model.TravelClaim)}">Reise</span>
            </td>
            <td th:text="${#numbers.formatDecimal(claim.amount(), 2, 'COMMA', 2, 'POINT')}">0,00</td>
            <td th:text="${assessmentService.assess(claim)}">Analyse</td>
            <td th:text="${assessmentService.nextStep(claim)}">Aktion</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
